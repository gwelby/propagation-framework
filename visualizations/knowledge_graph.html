<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #07090f; font-family: 'Courier New', monospace; overflow: hidden; }

  #canvas { width: 100vw; height: 100vh; }

  .tooltip {
    position: absolute;
    background: rgba(10, 15, 30, 0.95);
    border: 1px solid #334466;
    border-radius: 6px;
    padding: 12px 16px;
    color: #ccd6f6;
    font-size: 12px;
    max-width: 280px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    line-height: 1.6;
  }

  #legend {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(10, 15, 30, 0.9);
    border: 1px solid #1a2a4a;
    border-radius: 8px;
    padding: 16px;
    color: #8892b0;
    font-size: 11px;
  }

  #legend h3 { color: #ccd6f6; font-size: 13px; margin-bottom: 10px; letter-spacing: 1px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #title {
    position: absolute;
    top: 20px;
    right: 20px;
    text-align: right;
    color: #8892b0;
    font-size: 11px;
  }
  #title h2 { color: #ccd6f6; font-size: 16px; margin-bottom: 4px; }

  #confidence-bar {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 15, 30, 0.9);
    border: 1px solid #1a2a4a;
    border-radius: 8px;
    padding: 10px 20px;
    color: #8892b0;
    font-size: 11px;
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .conf-item { text-align: center; }
  .conf-val { color: #ccd6f6; font-size: 14px; font-weight: bold; }
</style>

<body>

<svg id="canvas"></svg>

<div class="tooltip" id="tooltip"></div>

<div id="legend">
  <h3>CLAIM STATUS</h3>
  <div class="legend-item"><div class="legend-dot" style="background:#64ffda"></div>DERIVED (0.90–1.00)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4488ff"></div>ARGUED (0.70–0.89)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffcc44"></div>EMPIRICAL (0.60–0.95)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff9944"></div>INTUITION (0.30–0.59)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff4455"></div>OPEN (0.00–0.29)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffffff"></div>AXIOM</div>
  <br>
  <div style="color:#556; font-size:10px">Node size = confidence<br>Drag to explore</div>
</div>

<div id="title">
  <h2>PROPAGATION FRAMEWORK</h2>
  <div>Knowledge Graph — 2026-03-20</div>
  <div style="margin-top:4px; color:#445">Hover nodes for detail</div>
</div>

<div id="confidence-bar">
  <div class="conf-item"><div class="conf-val">3</div><div>Axioms</div></div>
  <div class="conf-item"><div class="conf-val">7</div><div>Derived</div></div>
  <div class="conf-item"><div class="conf-val">5</div><div>Argued</div></div>
  <div class="conf-item"><div class="conf-val">2</div><div>Empirical</div></div>
  <div class="conf-item"><div class="conf-val">3</div><div>Intuition</div></div>
  <div class="conf-item"><div class="conf-val">1</div><div>Open</div></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

const nodes = [
  { id: "circular_coulomb_eikonal_phase_closure_b", label: "Circular Coulomb Eikonal + Pha", type: "derived", conf: 0.90 },
  { id: "gravity_as_optical_geometry_refraction", label: "Gravity as Optical Geometry / ", type: "derived", conf: 0.95 },
  { id: "topological_weights", label: "Topological Weights", type: "derived", conf: 0.85 },
  { id: "koide_law_for_charged_leptons_geometric_", label: "Koide Law for Charged Leptons ", type: "derived", conf: 0.95 },
  { id: "koide_u_entropy_selector", label: "Koide U entropy selector", type: "argued", conf: 0.72 },
  { id: "u_entropy_maximization", label: "U Entropy Maximization", type: "open", conf: 0.75 },
  { id: "koide_phase", label: "Koide Phase )", type: "empirical", conf: 0.65 },
  { id: "top_quark_limit", label: "Top Quark Limit", type: "argued", conf: 0.85 },
  { id: "top_tau_coupling", label: "Top/Tau coupling", type: "empirical", conf: 0.90 },
  { id: "electron_up_approx_1_phi_3", label: "Electron/Up \approx 1/\phi^3", type: "empirical", conf: 0.65 },
  { id: "coherence_ceiling", label: "Coherence Ceiling", type: "argued", conf: 0.80 },
  { id: "weinberg_angle", label: "Weinberg Angle", type: "argued", conf: 0.65 },
  { id: "fine_structure_constant_numeric_derivati", label: "Fine Structure Constant α — nu", type: "open", conf: 0.46 },
  { id: "fine_structure_constant_structural_ident", label: "Fine Structure Constant α — st", type: "argued", conf: 0.60 },
  { id: "propagation_lagrangian", label: "Propagation Lagrangian", type: "derived", conf: 0.72 },
  { id: "variable_c_prediction", label: "Variable c Prediction", type: "argued", conf: 0.65 },
  { id: "qcd_confinement", label: "QCD Confinement", type: "argued", conf: 0.72 },
  { id: "god_equation_postulate_d_z_operator_alge", label: "God Equation — Postulate-D Z₃ ", type: "derived", conf: 0.88 },
  { id: "god_equation_c_scale_formula", label: "God Equation — λ_c scale formu", type: "derived", conf: 0.60 },
  { id: "neutrino_koide_non_universality", label: "Neutrino Koide non-universalit", type: "empirical", conf: 0.95 },
  { id: "d_3_is_the_unique_stable_dimension_for_t", label: "D=3 is the unique stable dimen", type: "derived", conf: 0.85 },
  { id: "degenerate_residue_forces_circulant_form", label: "Degenerate residue forces circ", type: "derived", conf: 0.85 },
  { id: "d_3_symmetric_zero_diagonal_equal_row_su", label: "D=3 symmetric + zero diagonal ", type: "derived", conf: 0.85 },
  { id: "d_4_gap_symmetric_zero_diagonal_equal_ro", label: "D≥4 gap: symmetric + zero diag", type: "derived", conf: 0.85 },
  { id: "pfentropy_decreases_under_t", label: "PFEntropy decreases under T³", type: "derived", conf: 0.85 },
  { id: "full_norm_pythagorean_decomposition", label: "Full-norm Pythagorean decompos", type: "derived", conf: 0.95 },
  { id: "isometry_ji_incompatibility", label: "Isometry-JI incompatibility", type: "derived", conf: 0.85 },
  { id: "h14_h15_h16_h1", label: "H14 + H15 + H16 → H1", type: "derived", conf: 0.85 },
  { id: "life_maintained_coherence_against_entrop", label: "Life = maintained coherence ag", type: "argued", conf: 0.72 },
  { id: "consciousness_coherent_self_referential_", label: "Consciousness = coherent self-", type: "intuition", conf: 0.48 },
  { id: "8h_sleep_constant", label: "8h Sleep Constant", type: "argued", conf: 0.72 },
  { id: "beauty_as_impedance", label: "Beauty as Impedance", type: "intuition", conf: 0.55 },
  { id: "2_3_efficiency_ratio", label: "2/3 Efficiency Ratio", type: "intuition", conf: 0.50 },
  { id: "aria_self_reference", label: "Aria Self-Reference", type: "argued", conf: 0.75 },
];

const links = [
  { source: "fine_structure_constant_numeric_derivati", target: "fine_structure_constant_structural_ident" },
];

const typeColors = {
  axiom:    "#ffffff",
  derived:  "#64ffda",
  argued:   "#4488ff",
  empirical:"#ffcc44",
  intuition:"#ff9944",
  open:     "#ff4455"
};

const svg = d3.select("#canvas");
const width = window.innerWidth;
const height = window.innerHeight;
svg.attr("width", width).attr("height", height);

// Gradient defs
const defs = svg.append("defs");
nodes.forEach(n => {
  const grad = defs.append("radialGradient")
    .attr("id", `grad-${n.id}`)
    .attr("cx", "40%").attr("cy", "35%");
  grad.append("stop").attr("offset", "0%")
    .attr("stop-color", d3.color(typeColors[n.type]).brighter(0.8));
  grad.append("stop").attr("offset", "100%")
    .attr("stop-color", typeColors[n.type]);
});

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
    const s = nodes.find(n => n.id === d.source.id || n.id === d.source);
    const t = nodes.find(n => n.id === d.target.id || n.id === d.target);
    return 120 + (1 - ((s?.conf || 0.5) + (t?.conf || 0.5)) / 2) * 60;
  }).strength(0.4))
  .force("charge", d3.forceManyBody().strength(-400))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => getRadius(d) + 15))
  .force("y", d3.forceY(d => {
    const yOrder = { axiom: 0.2, derived: 0.38, argued: 0.56, empirical: 0.72, intuition: 0.82, open: 0.92 };
    return height * (yOrder[d.type] || 0.5);
  }).strength(0.3));

function getRadius(d) {
  return 16 + d.conf * 22;
}

// Links
const link = svg.append("g").selectAll("line")
  .data(links).join("line")
  .attr("stroke", "#1a2a4a")
  .attr("stroke-width", 1.5)
  .attr("stroke-opacity", 0.6);

// Node groups
const node = svg.append("g").selectAll("g")
  .data(nodes).join("g")
  .call(d3.drag()
    .on("start", (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
    .on("end", (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }));

// Outer glow ring
node.append("circle")
  .attr("r", d => getRadius(d) + 6)
  .attr("fill", "none")
  .attr("stroke", d => typeColors[d.type])
  .attr("stroke-width", 1)
  .attr("stroke-opacity", 0.2);

// Main circle
node.append("circle")
  .attr("r", d => getRadius(d))
  .attr("fill", d => `url(#grad-${d.id})`)
  .attr("stroke", d => typeColors[d.type])
  .attr("stroke-width", d => d.type === "axiom" ? 2.5 : 1.5)
  .attr("stroke-opacity", 0.9);

// Label
node.append("text")
  .text(d => d.label)
  .attr("text-anchor", "middle")
  .attr("dy", d => d.conf > 0.7 ? "-0.15em" : "0.35em")
  .attr("fill", "#e0e8ff")
  .attr("font-size", d => d.type === "axiom" ? "11px" : "10px")
  .attr("font-weight", d => d.type === "axiom" ? "bold" : "normal")
  .attr("pointer-events", "none");

// Sub-label (confidence)
node.filter(d => d.type !== "axiom")
  .append("text")
  .text(d => d.conf.toFixed(2))
  .attr("text-anchor", "middle")
  .attr("dy", "1.1em")
  .attr("fill", d => typeColors[d.type])
  .attr("font-size", "9px")
  .attr("opacity", 0.8)
  .attr("pointer-events", "none");

// Tooltip
const tooltip = d3.select("#tooltip");

node.on("mouseover", (event, d) => {
  tooltip
    .style("opacity", 1)
    .html(`
      <div style="color:${typeColors[d.type]}; font-weight:bold; margin-bottom:6px">${d.label}</div>
      <div style="color:#8892b0; margin-bottom:6px">${d.sub}</div>
      <div>${d.detail}</div>
    `);
})
.on("mousemove", (event) => {
  const x = event.pageX + 15;
  const y = event.pageY - 10;
  tooltip
    .style("left", Math.min(x, width - 310) + "px")
    .style("top", y + "px");
})
.on("mouseout", () => {
  tooltip.style("opacity", 0);
});

// Layer labels
const layers = [
  { y: 0.2,  label: "AXIOMS", color: "#ffffff" },
  { y: 0.38, label: "DERIVED", color: "#64ffda" },
  { y: 0.56, label: "ARGUED", color: "#4488ff" },
  { y: 0.72, label: "EMPIRICAL", color: "#ffcc44" },
  { y: 0.82, label: "INTUITION", color: "#ff9944" },
  { y: 0.92, label: "OPEN", color: "#ff4455" },
];

layers.forEach(l => {
  svg.append("text")
    .text(l.label)
    .attr("x", width - 20)
    .attr("y", height * l.y)
    .attr("text-anchor", "end")
    .attr("fill", l.color)
    .attr("font-size", "10px")
    .attr("opacity", 0.35)
    .attr("letter-spacing", "2px");
});

simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

</script>
</body>
</html>
