  <g transform="translate(80,430)">
    <circle r="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="-2" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle">Var-c</text>
    <text x="0" y="9" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)" text-anchor="middle">0.65</text>
  </g>
  <g transform="translate(200,440)">
    <circle r="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="0" y="-2" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle">Fine</text>
    <text x="0" y="9" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle">Struct.</text>
    <text x="0" y="20" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.25)" text-anchor="middle">0.60</text>
  </g>
  <g transform="translate(340,450)">
