  <g transform="translate(640,232)">
    <circle r="22" fill="rgba(0,207,255,0.18)" stroke="#00cfff" stroke-width="1.8" filter="url(#glow-sm)"/>
    <text x="0" y="-4" font-family="monospace" font-size="8" fill="#00cfff" text-anchor="middle">Weinberg</text>
    <text x="0" y="8" font-family="monospace" font-size="8" fill="#00cfff" text-anchor="middle">Angle</text>
    <text x="0" y="20" font-family="monospace" font-size="7" fill="rgba(0,207,255,0.6)" text-anchor="middle">0.90</text>
