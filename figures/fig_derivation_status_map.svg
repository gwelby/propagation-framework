  <g transform="translate(820,200)">
    <circle r="15" fill="rgba(255,68,85,0.12)" stroke="#ff4455" stroke-width="1.2"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ff4455" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ff4455" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="26" font-family="monospace" font-size="7" fill="#ff4455" text-anchor="middle">φ-Harm.</text>
  </g>
  <g transform="translate(840,290)">
    <circle r="15" fill="rgba(255,68,85,0.12)" stroke="#ff4455" stroke-width="1.2"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ff4455" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ff4455" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="26" font-family="monospace" font-size="7" fill="#ff4455" text-anchor="middle">Casimir</text>
  </g>
  <g transform="translate(820,375)">
    <circle r="15" fill="rgba(255,68,85,0.12)" stroke="#ff4455" stroke-width="1.2"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ff4455" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ff4455" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="26" font-family="monospace" font-size="7" fill="#ff4455" text-anchor="middle">Edge-Flux</text>
  </g>
  <g transform="translate(840,450)">
    <circle r="15" fill="rgba(255,68,85,0.12)" stroke="#ff4455" stroke-width="1.2"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ff4455" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ff4455" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="26" font-family="monospace" font-size="7" fill="#ff4455" text-anchor="middle">RG-Koide</text>
  </g>

  <!-- No-go label -->
  <text x="838" y="170" font-family="monospace" font-size="9" fill="rgba(255,68,85,0.5)"
        text-anchor="middle" letter-spacing="0.05em">NO-GO</text>
  <text x="838" y="182" font-family="monospace" font-size="9" fill="rgba(255,68,85,0.5)"
        text-anchor="middle" letter-spacing="0.05em">MUSEUM</text>

  <!-- Confidence score note -->
  <text x="450" y="548" font-family="Georgia,serif" font-size="11"
        fill="rgba(255,255,255,0.25)" text-anchor="middle" font-style="italic">
    Numbers show confidence scores. DERIVED requires independent Codex audit. NO-GO entries are preserved, not hidden.
  </text>
</svg>
