    <text x="0" y="-3" font-family="monospace" font-size="8" fill="#ffaa33" text-anchor="middle">God Eq.</text>
    <text x="0" y="9" font-family="monospace" font-size="7" fill="rgba(255,170,51,0.6)" text-anchor="middle">0.88</text>
  </g>

  <!-- 3 Generations -->
  <line x1="440" y1="136" x2="320" y2="300" stroke="rgba(255,170,51,0.2)" stroke-width="1"/>
  <g transform="translate(300,320)">
    <circle r="20" fill="rgba(255,170,51,0.15)" stroke="#ffaa33" stroke-width="1.5" filter="url(#glow-sm)"/>
    <text x="0" y="-3" font-family="monospace" font-size="8" fill="#ffaa33" text-anchor="middle">3 Gen.</text>
    <text x="0" y="9" font-family="monospace" font-size="7" fill="rgba(255,170,51,0.6)" text-anchor="middle">0.85</text>
  </g>

