    <text x="0" y="-3" font-family="monospace" font-size="7.5" fill="#ffdd55" text-anchor="middle">Koide</text>
    <text x="0" y="8" font-family="monospace" font-size="7.5" fill="#ffdd55" text-anchor="middle">Phase</text>
    <text x="0" y="19" font-family="monospace" font-size="7" fill="rgba(255,221,85,0.5)" text-anchor="middle">0.65</text>
  </g>

  <line x1="464" y1="136" x2="730" y2="290" stroke="rgba(255,221,85,0.15)" stroke-width="1"/>
  <g transform="translate(752,305)">
    <circle r="18" fill="rgba(255,221,85,0.12)" stroke="#ffdd55" stroke-width="1.5"/>
    <text x="0" y="-3" font-family="monospace" font-size="7.5" fill="#ffdd55" text-anchor="middle">Top-Tau</text>
    <text x="0" y="8" font-family="monospace" font-size="7.5" fill="#ffdd55" text-anchor="middle">Coupling</text>
    <text x="0" y="19" font-family="monospace" font-size="7" fill="rgba(255,221,85,0.5)" text-anchor="middle">0.90</text>
  </g>

