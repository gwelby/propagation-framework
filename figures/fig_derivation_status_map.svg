<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-sm"><feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="580" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="28" font-family="Georgia,serif" font-size="14"
        fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="0.08em">
    DERIVATION STATUS MAP · The Propagation Framework
  </text>

  <!-- Legend -->
  <g transform="translate(30,50)">
    <circle cx="8" cy="8" r="7" fill="#00cfff" filter="url(#glow-sm)"/>
    <text x="22" y="13" font-family="monospace" font-size="10" fill="#00cfff">DERIVED</text>
    <circle cx="95" cy="8" r="7" fill="#ffaa33" filter="url(#glow-sm)"/>
    <text x="109" y="13" font-family="monospace" font-size="10" fill="#ffaa33">CONDITIONAL</text>
    <circle cx="210" cy="8" r="7" fill="#ffdd55" filter="url(#glow-sm)"/>
    <text x="224" y="13" font-family="monospace" font-size="10" fill="#ffdd55">EMPIRICAL</text>
    <circle cx="305" cy="8" r="7" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <text x="319" y="13" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.5)">ARGUED</text>
    <circle cx="385" cy="8" r="7" fill="#ff4455" filter="url(#glow-sm)"/>
    <text x="399" y="13" font-family="monospace" font-size="10" fill="#ff4455">NO-GO</text>
  </g>

  <!-- ── AXIOMS (center, top) ── -->
  <g transform="translate(450,110)">
    <circle r="26" fill="rgba(0,207,255,0.15)" stroke="#00cfff" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="-5" font-family="monospace" font-size="9" fill="#00cfff" text-anchor="middle">3</text>
    <text x="0" y="8" font-family="monospace" font-size="9" fill="#00cfff" text-anchor="middle">AXIOMS</text>
  </g>

  <!-- ── DERIVED nodes ── -->
  <!-- Gravity-Optical -->
  <line x1="430" y1="120" x2="160" y2="210" stroke="rgba(0,207,255,0.25)" stroke-width="1"/>
  <g transform="translate(130,225)">
    <circle r="22" fill="rgba(0,207,255,0.18)" stroke="#00cfff" stroke-width="1.8" filter="url(#glow-sm)"/>
    <text x="0" y="-4" font-family="monospace" font-size="8" fill="#00cfff" text-anchor="middle">Gravity</text>
    <text x="0" y="8" font-family="monospace" font-size="8" fill="#00cfff" text-anchor="middle">Optical</text>
    <text x="0" y="20" font-family="monospace" font-size="7" fill="rgba(0,207,255,0.6)" text-anchor="middle">0.95</text>
  </g>

  <!-- Koide -->
  <line x1="450" y1="136" x2="295" y2="220" stroke="rgba(0,207,255,0.25)" stroke-width="1"/>
  <g transform="translate(270,238)">
    <circle r="22" fill="rgba(0,207,255,0.18)" stroke="#00cfff" stroke-width="1.8" filter="url(#glow-sm)"/>
    <text x="0" y="-4" font-family="monospace" font-size="8" fill="#00cfff" text-anchor="middle">Koide</text>
    <text x="0" y="8" font-family="monospace" font-size="8" fill="#00cfff" text-anchor="middle">Leptons</text>
    <text x="0" y="20" font-family="monospace" font-size="7" fill="rgba(0,207,255,0.6)" text-anchor="middle">0.95</text>
  </g>

