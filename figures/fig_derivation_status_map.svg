  <line x1="436" y1="136" x2="170" y2="300" stroke="rgba(255,170,51,0.2)" stroke-width="1"/>
  <g transform="translate(150,318)">
    <circle r="20" fill="rgba(255,170,51,0.15)" stroke="#ffaa33" stroke-width="1.5" filter="url(#glow-sm)"/>
